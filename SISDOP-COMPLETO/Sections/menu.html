<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../StyleSheets/main.css">
  <script src="../Scripts/main.js" defer></script>
  <script type="module" src="../Scripts/supabase.js" defer></script>
</head>
<body>
  <section class="active" id="menu">
    <div class="menu-container">
      <nav class="sidebar" id="sidebar">
        <a onclick="toggleSidebar()" class="active" id="btn-menu" title="Menu">
          <span class="hamburger">&#9776;</span><span class="sidebar-label"> Menu</span>
        </a>
        <a onclick="showMenuContent('ongs')" title="ONGs">
          <span class="sidebar-icon">🤝</span><span class="sidebar-label">ONGs</span>
        </a>
        <a onclick="showMenuContent('usuarios')" title="Usuários">
          <span class="sidebar-icon">👤</span><span class="sidebar-label">Usuários</span>
        </a>
        <a onclick="showMenuContent('produtos')" title="Produtos">
          <span class="sidebar-icon">📦</span><span class="sidebar-label">Produtos</span>
        </a>
        <a onclick="showMenuContent('acoes')" title="Ações">
          <span class="sidebar-icon">⚡</span><span class="sidebar-label">Ações</span>
        </a>
        <a href="../index.html" title="Sair">
          <span class="sidebar-icon">🚪</span><span class="sidebar-label">Sair</span>
        </a>
      </nav>

      <main class="main">
        <img src="../public/assets/Logo Dourada.png" class="main-bg-logo">

        <!-- Home -->
        <div id="menu-home" class="menu-content active"></div>

        <!-- ONGs -->
        <div id="ongs" class="menu-content">
          <h2>Gerenciar ONGs</h2>
          <div class="ongs-controls">
            <button class="btn-primary" onclick="showAddOngForm()">Adicionar Nova ONG</button>
          </div>
          <div id="add-edit-ong-form" class="form-modal" style="display: none;">
            <h3><span id="ong-form-title">Adicionar</span> ONG</h3>
            <form onsubmit="event.preventDefault(); saveOng();">
              <div><label for="ong-nome">Nome da ONG:</label><input type="text" id="ong-nome" required></div>
              <div><label for="ong-email">E-mail:</label><input type="email" id="ong-email" required></div>
              <div><label for="ong-cnpj">CNPJ:</label><input type="text" id="ong-cnpj" required></div>
              <div><label for="ong-telefone">Telefone:</label><input type="tel" id="ong-telefone"></div>
              <div><label for="ong-area">Área de Atuação:</label><input type="text" id="ong-area"></div>
              <button type="submit" class="btn-primary">Salvar ONG</button>
              <button type="button" class="btn-secondary" onclick="hideOngForm()">Cancelar</button>
            </form>
          </div>
          <div class="dashboard" id="divCardsOngs"></div>
        </div>

        <!-- Usuários -->
        <div id="usuarios" class="menu-content">
          <h2>Gerenciar Usuários</h2>
          <div class="usuarios-controls">
            <button class="btn-primary" onclick="showAddUserForm()">Adicionar Novo Usuário</button>
          </div>
          <div id="add-edit-usuario-form" class="form-modal" style="display: none;">
            <h3><span id="user-form-title">Adicionar</span> Usuário</h3>
            <form onsubmit="event.preventDefault(); saveUser();">
              <div><label for="user-form-nome">Nome:</label><input type="text" id="user-form-nome" required></div>
              <div><label for="user-form-email">E-mail:</label><input type="email" id="user-form-email" required></div>
              <div><label for="user-form-tipo">Tipo:</label><input type="text" id="user-form-tipo" required></div>
              <div><label for="user-form-cpf">CPF:</label><input type="text" id="user-form-cpf"></div>
              <button type="submit" class="btn-primary">Salvar Usuário</button>
              <button type="button" class="btn-secondary" onclick="hideUserForm()">Cancelar</button>
            </form>
          </div>
          <div class="dashboard" id="divCardsUsers"></div>
        </div>

        <!-- Produtos -->
        <div id="produtos" class="menu-content">
          <h2>Gerenciar Produtos</h2>
          <div class="produtos-form-inline">
            <h3><span id="produto-form-title">Cadastrar</span> Produto</h3>
            <form onsubmit="event.preventDefault(); saveProduto();">
              <div>
                <label for="produto-nome">Nome do Produto:</label>
                <input type="text" id="produto-nome" placeholder="Ex: Arroz 5kg" required>
              </div>
              <div>
                <label for="produto-quantidade">Quantidade:</label>
                <input type="number" id="produto-quantidade" min="1" placeholder="Ex: 10" required>
              </div>
              <div>
                <label for="produto-validade">Data de Validade:</label>
                <input type="date" id="produto-validade" required>
              </div>
              <button type="submit" class="btn-primary">Salvar Produto</button>
              <button type="button" class="btn-secondary" onclick="limparProdutoForm()">Limpar</button>
            </form>
          </div>
          <div class="dashboard" id="divCardsProdutos"></div>
        </div>

        <!-- Ações -->
        <div id="acoes" class="menu-content">
          <h2>Gerenciar Ações</h2>

          <div class="produtos-form-inline">
            <h3><span id="acao-form-title">Cadastrar</span> Ação</h3>
            <form onsubmit="event.preventDefault(); saveAcao();">
              <div>
                <label for="acao-data">Data Realizada:</label>
                <input type="date" id="acao-data" required>
              </div>
              <div>
                <label for="acao-local">Local:</label>
                <input type="text" id="acao-local" placeholder="Ex: Rua das Flores, 123" required>
              </div>
              <div>
                <label for="acao-total-produtos">Total de Produtos Entregues:</label>
                <input type="number" id="acao-total-produtos" min="1" placeholder="Ex: 50" required>
              </div>
              <button type="submit" class="btn-primary">Salvar Ação</button>
              <button type="button" class="btn-secondary" onclick="limparAcaoForm()">Limpar</button>
            </form>
          </div>

          <div class="dashboard" id="divCardsAcoes"></div>
        </div>

      </main>
    </div>
  </section>
</body>
</html>
